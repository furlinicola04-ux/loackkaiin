<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Diario di peso, alimentazione, sonno, wellness, BIA e partite.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lock-in">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>loackkainn</title>
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f7">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
<meta name="color-scheme" content="light dark">
<style>
/* Stile iOS: sfondo raggruppato grigio, schede bianche senza bordo, testo di sistema (SF), numeri SF Rounded, barra schede in materiale traslucido, un solo colore di tinta (lampone Rovato) */
:root{
  --bg:#f2f2f7; --surface:#ffffff; --surface-solid:#ffffff; --fill:rgba(118,118,128,.12); --fill-2:rgba(118,118,128,.08);
  --line:rgba(60,60,67,.16); --ink:#000000; --muted:rgba(60,60,67,.62); --muted-2:rgba(60,60,67,.36);
  --accent:#c2185b; --accent-ink:#ffffff; --accent-soft:rgba(194,24,91,.11);
  --mp:#c2185b; --mc:#e8a0bb; --mg:#aeaeb2; --track:rgba(118,118,128,.14);
  --good:#1c1c1e; --warn:#6c6c70; --bad:#c2185b; --good-bg:rgba(118,118,128,.12); --warn-bg:rgba(118,118,128,.12); --bad-bg:rgba(194,24,91,.11);
  --chart:#1c1c1e; --chart-soft:rgba(0,0,0,.05); --chart-2:#c7c7cc;
  --c-peso:var(--muted); --c-cibo:var(--muted); --c-sonno:var(--muted); --c-well:var(--muted); --c-match:var(--muted);
  --material:rgba(249,249,249,.78); --thumb:#ffffff; --scrim:rgba(0,0,0,.32);
  --display:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
  --ease-sheet:cubic-bezier(.32,.72,0,1); color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#1c1c1e; --surface-solid:#1c1c1e; --fill:rgba(118,118,128,.24); --fill-2:rgba(118,118,128,.16);
  --line:rgba(84,84,88,.6); --ink:#ffffff; --muted:rgba(235,235,245,.6); --muted-2:rgba(235,235,245,.3);
  --accent:#ff5c93; --accent-ink:#2a0013; --accent-soft:rgba(255,92,147,.16);
  --mp:#ff5c93; --mc:#9e4a6b; --mg:#636366; --track:rgba(118,118,128,.28);
  --good:#f2f2f7; --warn:#aeaeb2; --bad:#ff5c93; --good-bg:rgba(118,118,128,.24); --warn-bg:rgba(118,118,128,.24); --bad-bg:rgba(255,92,147,.16);
  --chart:#f2f2f7; --chart-soft:rgba(255,255,255,.06); --chart-2:#48484a;
  --c-peso:var(--muted); --c-cibo:var(--muted); --c-sonno:var(--muted); --c-well:var(--muted); --c-match:var(--muted);
  --material:rgba(22,22,24,.78); --thumb:#636366; --scrim:rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1c1c1e; --surface-solid:#1c1c1e; --fill:rgba(118,118,128,.24); --fill-2:rgba(118,118,128,.16);
  --line:rgba(84,84,88,.6); --ink:#ffffff; --muted:rgba(235,235,245,.6); --muted-2:rgba(235,235,245,.3);
  --accent:#ff5c93; --accent-ink:#2a0013; --accent-soft:rgba(255,92,147,.16);
  --mp:#ff5c93; --mc:#9e4a6b; --mg:#636366; --track:rgba(118,118,128,.28);
  --good:#f2f2f7; --warn:#aeaeb2; --bad:#ff5c93; --good-bg:rgba(118,118,128,.24); --warn-bg:rgba(118,118,128,.24); --bad-bg:rgba(255,92,147,.16);
  --chart:#f2f2f7; --chart-soft:rgba(255,255,255,.06); --chart-2:#48484a;
  --c-peso:var(--muted); --c-cibo:var(--muted); --c-sonno:var(--muted); --c-well:var(--muted); --c-match:var(--muted);
  --material:rgba(22,22,24,.78); --thumb:#636366; --scrim:rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg);-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.35;letter-spacing:-.01em;min-height:100dvh;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--material);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%)}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button,a,[role="button"],label.btn,.seg label{touch-action:manipulation}
button,.tab,.chip,.seg span,label.btn{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
h1,h2,h3{font-family:var(--body);margin:0;text-wrap:balance}
h1{font-size:34px;font-weight:700;line-height:1.08;letter-spacing:-.022em}
h2{font-size:22px;font-weight:700;line-height:1.2;letter-spacing:-.016em}
h3{font-size:17px;font-weight:600;letter-spacing:-.01em}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
main{max-width:720px;margin:0 auto;padding-block:max(12px,env(safe-area-inset-top,0px)) calc(110px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{display:grid;gap:16px}
.eyebrow{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.02em;color:var(--muted)}
.eyebrow.acc{color:var(--accent)}
.card{background:var(--surface);border-radius:16px;padding:16px;min-width:0}
.hero{background:var(--surface);border-radius:20px;padding:18px;display:grid;gap:10px}
.hero .big{font-family:var(--display);font-weight:700;font-size:54px;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.hero .big small{font-size:20px;font-weight:600;color:var(--muted);letter-spacing:-.01em}
.sub{font-size:15px;color:var(--muted);letter-spacing:-.005em}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:13px 18px;font-weight:600;font-size:17px;letter-spacing:-.02em;cursor:pointer;background:var(--accent);color:var(--accent-ink);min-height:50px;transition:transform 120ms ease-out,opacity 120ms ease-out}
.btn:active{transform:scale(.97);opacity:.85}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.link{background:transparent;color:var(--accent);padding:8px 4px;min-height:0;font-weight:400}
.btn.link:active{transform:none;opacity:.5}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn.sm{padding:7px 14px;min-height:34px;font-size:15px;border-radius:999px}
.btn:disabled{opacity:.4;cursor:default}
.btn svg,.ico svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ico{width:44px;height:44px;border-radius:999px;border:0;background:transparent;color:var(--accent);display:inline-grid;place-items:center;cursor:pointer;flex:none;transition:transform 120ms ease-out}
.ico:active{transform:scale(.9)}
.ico.box{width:30px;height:30px;background:var(--fill);color:var(--muted)}
.ico.box svg{width:15px;height:15px;stroke-width:2.6}
.ico:disabled{opacity:.3}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px}
.note{display:flex;gap:12px;background:var(--surface);border-radius:14px;padding:14px 16px;font-size:15px;line-height:1.45;color:var(--muted)}
.note b{color:var(--ink)}
.note svg{width:22px;height:22px;stroke:var(--accent);fill:none;stroke-width:2;flex:none;margin-top:1px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;border-radius:999px;padding:3px 10px;width:max-content;max-width:100%}
.chip.good{background:var(--good-bg);color:var(--good)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.neu{background:var(--fill);color:var(--muted)} .chip.acc{background:var(--accent-soft);color:var(--accent)}
.tag{display:inline-block;justify-self:start;width:max-content;font-size:12px;font-weight:600;border-radius:6px;padding:3px 8px;background:var(--fill);color:var(--muted)}

/* tessere stile app Salute: nome categoria colorato, numero grande arrotondato */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border:0;border-radius:18px;padding:14px 16px 16px;display:grid;gap:4px;align-content:start;min-width:0;text-align:left;cursor:pointer;color:inherit;transition:transform 120ms ease-out}
button.tile:active{transform:scale(.98)}
.tile.wide{grid-column:1/-1}
.tile .lab{font-size:15px;color:var(--tc,var(--muted));font-weight:600;letter-spacing:-.01em}
.tile .v{font-family:var(--display);font-size:34px;font-weight:700;line-height:1.05;letter-spacing:-.025em;font-variant-numeric:tabular-nums;margin-top:6px}
.tile .v small{font-size:16px;color:var(--muted);font-weight:600;margin-left:3px;letter-spacing:-.01em}
.tile .s{font-size:13px;color:var(--muted);letter-spacing:0}

/* barre macro */
.macros{display:grid;gap:14px}
.mbar .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:16px}
.mbar .top b{font-family:var(--display);font-size:19px;font-weight:700}
.mbar .top span.t{color:var(--muted);font-size:14px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;vertical-align:1px}
.track{height:8px;border-radius:99px;background:var(--track);margin-top:6px;overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;transition:width 400ms var(--ease-sheet)}
.mbar .rem{font-size:13px;color:var(--muted);margin-top:5px}

/* pasti */
.meal{display:grid;gap:0}
.meal-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding-bottom:12px;border-bottom:.5px solid var(--line)}
.meal-h .time{font-size:13px;font-weight:600;color:var(--accent);letter-spacing:.02em}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:4px 6px;align-items:center;padding:12px 0;border-bottom:.5px solid var(--line)}
.item .nm{font-weight:400;overflow-wrap:anywhere}
.item .q{font-size:13px;color:var(--muted)}
.item .k{text-align:right;font-variant-numeric:tabular-nums;font-size:15px;line-height:1.15;min-width:44px;font-weight:600}
.item .k small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.mtot{display:flex;gap:16px;flex-wrap:wrap;align-items:baseline;padding:14px 0 12px;font-variant-numeric:tabular-nums;font-size:15px}
.mtot .p{color:var(--mp)} .mtot .c{color:var(--mc)} .mtot .g{color:var(--mg)}
.mtot b{font-weight:700}
.meal-f{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;border-top:.5px solid var(--line);padding-top:6px}
.empty{color:var(--muted);font-size:15px;padding:14px 0}

/* moduli: campi grigi senza bordo come in Impostazioni */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:420px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
label.f{display:grid;gap:6px;font-size:13px;color:var(--muted);font-weight:500;min-width:0}
.inp{width:100%;min-width:0;border:0;background:var(--fill);border-radius:10px;padding:12px 13px;font-size:17px;color:var(--ink);min-height:44px}
.inp::placeholder{color:var(--muted-2)}
.inp:focus{outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
select.inp{-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
input[type=date].inp,input[type=time].inp{-webkit-appearance:none;appearance:none}
textarea.inp{min-height:84px;resize:vertical;line-height:1.4}
.hint{font-size:13px;color:var(--muted);margin:0;line-height:1.4;letter-spacing:0}
fieldset{border:0;padding:0;margin:0;display:grid;gap:12px;min-width:0}
/* controllo segmentato iOS */
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:0;background:var(--fill);border-radius:9px;padding:2px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0;margin:0}
.seg span{display:block;text-align:center;padding:7px 0;border-radius:7px;font-family:var(--display);font-size:16px;font-weight:600;cursor:pointer;transition:background 160ms ease-out,box-shadow 160ms ease-out}
.seg input:checked+span{background:var(--accent);color:var(--accent-ink);box-shadow:0 3px 8px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.08)}
.seg input:focus-visible+span{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent)}
.wrow{display:grid;grid-template-columns:minmax(0,118px) 1fr;gap:10px;align-items:center}
.wrow .lab{font-size:15px;font-weight:500}
.wrow .lab small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0}
.switch input{width:22px;height:22px;accent-color:var(--accent)}
.daynav{display:flex;align-items:center;gap:8px;justify-content:space-between;background:var(--surface);border-radius:16px;padding:6px}
.daynav .d{text-align:center;flex:1;min-width:0}
.daynav .d strong{font-size:17px;font-weight:600;display:block;line-height:1.2;text-transform:capitalize}
.daynav input{border:0;background:transparent;color:var(--muted);font-size:13px;text-align:center;max-width:100%}

/* tabelle con separatori sottili */
.tbl-wrap{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:15px}
th{font-size:13px;font-weight:500;color:var(--muted);text-align:left;padding:6px 6px 8px;white-space:nowrap}
td{padding:12px 6px;border-top:.5px solid var(--line);white-space:nowrap}
td.nt{white-space:normal;color:var(--muted);font-size:13px;min-width:90px}
tr.click{cursor:pointer;transition:background 120ms}
tr.click:active{background:var(--fill-2)}

/* grafici */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--body);font-size:11px;letter-spacing:0}
.chart .grid{stroke:var(--line);stroke-width:.5}
.chart .ln{fill:none;stroke:var(--chart);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .ln2{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.chart .raw{fill:var(--chart-2)}
.chart .area{fill:var(--chart-soft)}
.chart .col{fill:var(--chart)} .chart .col.low{fill:var(--accent)} .chart .col.match{fill:var(--accent)}
.chart .tgt{stroke:var(--accent);stroke-width:1.5;stroke-dasharray:4 4}
.chart .end{fill:var(--chart);stroke:var(--surface);stroke-width:2.5}
.chart .endlbl{fill:var(--ink);font-weight:700;font-size:12px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;background:var(--chart);vertical-align:3px;margin-right:5px}
.legend i.dot2{width:7px;height:7px;border-radius:50%;background:var(--chart-2);vertical-align:1px}
.legend i.dash{background:none;border-top:2px dashed var(--accent);height:0}
.legend i.acc{background:var(--accent)}
.legend i.low{background:var(--accent)}
.seg-t{display:inline-flex;background:var(--fill);border-radius:9px;padding:2px;gap:0}
.seg-t button{border:0;background:transparent;border-radius:7px;padding:6px 12px;font-size:13px;font-weight:500;color:var(--ink);cursor:pointer;transition:background 160ms ease-out}
.seg-t button[aria-pressed="true"]{background:var(--thumb);font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.06)}

/* BIA */
.bia-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.bia-grid .tile.wide{grid-column:1/-1}
.ref{position:relative;height:8px;border-radius:99px;margin-top:10px;background:var(--fill)}
.ref .ok{position:absolute;top:0;bottom:0;background:var(--good);opacity:.45;border-radius:99px}
.ref .me{position:absolute;top:-4px;width:4px;height:16px;border-radius:3px;background:var(--ink);transform:translateX(-2px);box-shadow:0 0 0 2px var(--surface)}
.ref-l{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.delta{font-size:13px;font-weight:600}
.delta.up{color:var(--good)} .delta.down{color:var(--bad)} .delta.flat{color:var(--muted)}

/* partite */
.mcard{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;align-items:start}
.mdate{text-align:center;border-right:.5px solid var(--line);padding-right:10px;color:var(--accent)}
.mdate b{display:block;font-family:var(--display);font-size:32px;font-weight:700;line-height:1}
.mdate span{display:block;font-size:13px;font-weight:600;text-transform:uppercase;margin-top:6px}
.mdate span+span{color:var(--muted);font-weight:400;margin-top:0}
.mteams{font-weight:700;font-size:19px;line-height:1.25;overflow-wrap:anywhere;margin-top:8px;letter-spacing:-.015em}
.mteams .vs{display:block;font-size:13px;font-weight:500;color:var(--muted);margin:2px 0}
.mscore{font-family:var(--display);font-weight:700;font-size:26px;font-variant-numeric:tabular-nums}
.res{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;font-weight:700;font-family:var(--display)}
.res.V{background:var(--good-bg);color:var(--good)} .res.P{background:var(--bad-bg);color:var(--bad)} .res.N{background:var(--warn-bg);color:var(--warn)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 10px}
.stats div{display:grid}
.stats b{font-family:var(--display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stats span{font-size:13px;color:var(--muted)}

/* menu Altro: elenco raggruppato con icone su quadratini colorati */
.menu{display:grid;background:var(--surface);border-radius:16px;overflow:hidden}
.menu button{display:grid;grid-template-columns:30px minmax(0,1fr) 14px;gap:14px;align-items:center;text-align:left;padding:11px 16px;border:0;background:transparent;cursor:pointer;color:inherit;position:relative;transition:background 120ms}
.menu button:active{background:var(--fill-2)}
.menu button+button::before{content:"";position:absolute;top:0;right:0;left:60px;border-top:.5px solid var(--line)}
.menu .mi{width:30px;height:30px;border-radius:8px;background:var(--fill);color:var(--ink);display:grid;place-items:center}
.menu .mi svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.menu strong{display:block;font-weight:400}
.menu small{display:block;color:var(--muted);font-size:13px}
.menu>button>svg{width:14px;height:14px;stroke:var(--muted-2);fill:none;stroke-width:2.5}
.back{display:inline-flex;align-items:center;gap:2px;background:none;border:0;color:var(--accent);font-size:17px;padding:8px 12px 8px 0;margin:-4px 0 -6px -2px;cursor:pointer;width:max-content;min-height:44px}
.back svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.under{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:var(--bg);will-change:transform}
.under::after{content:"";position:absolute;inset:0;background:#000;opacity:var(--dim,0)}
#app.swiping{position:relative;z-index:1;background:var(--bg);min-height:100dvh;box-shadow:-10px 0 30px rgba(0,0,0,.14);will-change:transform}
.back:active{opacity:.5}

/* piano */
.plan-g{padding:10px 0;border-top:.5px solid var(--line)}
.plan-g:first-of-type{border-top:0}
.plan-g ul{margin:6px 0 0;padding-left:18px;font-size:15px;color:var(--muted)}
.plan-g li{margin:2px 0}

const hitDot = (cx, cy, tip, cls, r) => `<g class="hit" data-tip="${esc(tip)}"><circle class="hz" cx="${cx}" cy="${cy}" r="14"/><circle class="${cls}" cx="${cx}" cy="${cy}" r="${r}"/></g>`;
const W = 420, H = 190, PL = 36, PR = 44, PT = 12, PB = 24;
function nice(lo, hi, steps = 4) { if (lo === hi) { lo -= 1; hi += 1; } const raw = (hi - lo) / steps, mag = 10 ** Math.floor(Math.log10(raw)); const st = [1, 2, 2.5, 5, 10].map(x => x * mag).find(x => x >= raw); return { lo: Math.floor(lo / st) * st, hi: Math.ceil(hi / st) * st, st }; }
function weightChart(n) {
  const PL = 10, PR = 10;
  const end = today(); const dates = Array.from({ length: n }, (_, i) => addDays(end, i - n + 1));
  const raw = dates.map((d, i) => ({ i, d, v: S.pesate[d] && num(S.pesate[d].peso) })).filter(p => p.v != null);
  if (raw.length < 2) return `<p class="empty">Servono almeno due pesate in questo periodo per disegnare l'andamento.</p>`;
  const av = dates.map((d, i) => ({ i, d, a: avg7(d) })).filter(p => p.a && p.i >= raw[0].i).map(p => ({ i: p.i, d: p.d, v: p.a.v }));
  const tg = num(S.profilo.pesoTarget); const vals = raw.map(p => p.v).concat(tg ? [tg] : []);
  const { lo, hi, st } = nice(Math.min(...vals) - .3, Math.max(...vals) + .3);
  const x = i => PL + (i / (n - 1)) * (W - PL - PR), y = v => PT + (1 - (v - lo) / (hi - lo)) * (H - PT - PB);
  let g = "";
  for (let v = lo; v <= hi + 1e-9; v += st) g += `<line class="grid" x1="${PL}" x2="${W - PR}" y1="${y(v)}" y2="${y(v)}"/>`;
  [0, Math.floor((n - 1) / 2), n - 1].forEach(i => g += `<text x="${x(i)}" y="${H - 6}" text-anchor="${i === 0 ? "start" : i === n - 1 ? "end" : "middle"}">${i === n - 1 ? "oggi" : shortDate(dates[i])}</text>`);
  const path = av.map((p, k) => `${k ? "L" : "M"}${x(p.i).toFixed(1)},${y(p.v).toFixed(1)}`).join("");
  const area = av.length > 1 ? `<path class="area" d="${path}L${x(av.at(-1).i)},${H - PB}L${x(av[0].i)},${H - PB}Z"/>` : "";
  const dots = raw.map(p => hitDot(x(p.i).toFixed(1), y(p.v).toFixed(1), `${shortDate(p.d)} · ${fmt(p.v)} kg`, "raw", 3)).join("");
  const e = av.at(-1);
  if (tg) g += `<line class="tgt" x1="${PL}" x2="${W - PR}" y1="${y(tg)}" y2="${y(tg)}"/><text x="${PL + 2}" y="${y(tg) - 6}" style="font-weight:600">obiettivo ${fmt(tg)}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Andamento del peso">${g}${area}<path class="ln" d="${path}"/>${hitDot(x(e.i).toFixed(1), y(e.v).toFixed(1), `media 7 gg · ${fmt(e.v)} kg`, "end", 4.5)}${dots}</svg>`;
}
function barChart(items, { target, unit, max, every = 1, fv = v => fmt(v, 0) }) {
  const n = items.length; if (!items.some(it => it.v)) return `<p class="empty">Nessun dato ancora in questo periodo.</p>`;
  const top = max ?? Math.max(...items.map(it => it.v || 0), target || 0) * 1.05;
  const { hi, st } = nice(0, top); const bw = (W - PL - 12) / n, y = v => PT + (1 - v / hi) * (H - PT - PB);
  let g = "";
  for (let v = 0; v <= hi + 1e-9; v += st) g += `<line class="grid" x1="${PL}" x2="${W - 12}" y1="${y(v)}" y2="${y(v)}"/><text x="${PL - 6}" y="${y(v) + 4}" text-anchor="end">${fv(v)}</text>`;
  items.forEach((it, i) => { const bx = PL + i * bw + bw * .18, w = bw * .64;
    if (it.v) g += `<g class="hit" data-tip="${esc(`${it.t} · ${it.tip || fv(it.v) + " " + unit}`)}"><rect class="hz" x="${PL + i * bw}" y="${PT}" width="${bw}" height="${H - PT - PB}"/><rect class="col ${it.cls || ""}" x="${bx}" y="${y(it.v)}" width="${w}" height="${y(0) - y(it.v)}" rx="3"/></g>`;
    if ((i % every === 0 && n - 1 - i >= every / 2) || i === n - 1) g += `<text x="${bx + w / 2}" y="${H - 6}" text-anchor="middle">${esc(it.l)}</text>`; });
  if (target) g += `<line class="tgt" x1="${PL}" x2="${W - 12}" y1="${y(target)}" y2="${y(target)}"/>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}
function lineChart(pts, { lo, hi, st, unit }) {
  const n = pts.length; const have = pts.filter(p => p.v != null); if (have.length < 2) return `<p class="empty">Compila il check-in per almeno due giorni per vedere l'andamento.</p>`;
  const x = i => PL + (i / (n - 1)) * (W - PL - PR), y = v => PT + (1 - (v - lo) / (hi - lo)) * (H - PT - PB);
  let g = ""; for (let v = lo; v <= hi + 1e-9; v += st) g += `<line class="grid" x1="${PL}" x2="${W - PR}" y1="${y(v)}" y2="${y(v)}"/><text x="${PL - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  [0, n - 1].forEach(i => g += `<text x="${x(i)}" y="${H - 6}" text-anchor="${i ? "end" : "start"}">${esc(pts[i].l)}</text>`);
  const path = have.map((p, k) => `${k ? "L" : "M"}${x(p.i).toFixed(1)},${y(p.v).toFixed(1)}`).join("");
  const e = have.at(-1);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}<path class="ln2" d="${path}"/>${have.map(p => `<circle cx="${x(p.i)}" cy="${y(p.v)}" r="3" fill="var(--accent)"><title>${esc(p.t)}: ${p.v} ${unit}</title></circle>`).join("")}<text class="endlbl" x="${x(e.i) + 8}" y="${y(e.v) + 4}">${e.v}</text></svg>`;
}
const mbar = (lab, color, v, t, unit = "g") => {
  const pct = t ? Math.min(100, v / t * 100) : 0; const rem = t ? t - v : null;
  return `<div class="mbar"><div class="top"><span><i class="dot" style="background:${color}"></i>${lab}</span><span><b>${int(v)}</b> <span class="t">/ ${int(t)} ${unit}</span></span></div>
  <div class="track"><i style="width:${pct}%;background:${color}"></i></div>
  <div class="rem">${rem == null ? "" : rem >= 0 ? `${int(rem)} ${unit} al riferimento` : `${int(-rem)} ${unit} oltre il riferimento`}</div></div>`;
};

/* ============ HOME ============ */
function sparkW(t, n = 14) {
  // se le pesate iniziano dopo l'inizio della finestra, il grafico parte dalla prima (minimo 7 giorni)
  const first = Array.from({ length: n }, (_, i) => addDays(t, i - n + 1)).findIndex(d => S.pesate[d] && num(S.pesate[d].peso) != null);
  if (first > 0) n = Math.max(7, n - first);
  const days = Array.from({ length: n }, (_, i) => addDays(t, i - n + 1)); sparkW.from = days[0];
  const pts = days.map((d, i) => { const p = S.pesate[d]; return { i, v: p ? num(p.peso) : null }; }).filter(p => p.v != null);
  if (pts.length < 2) return `<div class="spark-empty">Servono almeno due pesate per il grafico</div>`;
  const ma = days.map((d, i) => { const a = avg7(d); return a && pts.some(p => p.i <= i) ? { i, v: a.v } : null; }).filter(Boolean);
  const tg = num(S.profilo.pesoTarget), vals = pts.map(p => p.v).concat(ma.map(p => p.v));
  // il range include l'obiettivo solo se è vicino (entro 3 kg), altrimenti resta un'etichetta col freccia
  const near = tg != null && Math.abs(tg - (vals.reduce((a, b) => a + b) / vals.length)) <= 3;
  let lo = Math.min(...vals, ...(near ? [tg] : [])), hi = Math.max(...vals, ...(near ? [tg] : []));
  const span = Math.max(1.5, hi - lo); const step = span > 4 ? 1 : .5;
  lo = Math.floor((lo - span * .08) / step) * step; hi = Math.ceil((hi + span * .08) / step) * step;
  const ticks = []; for (let v = lo; v <= hi + 1e-9; v += step) ticks.push(+v.toFixed(1));
  const tk = ticks.length > 5 ? ticks.filter((_, k) => k % 2 === 0) : ticks;
  const W = 320, H = 150, L = 6, R = 6, T = 12, B = 22;
  const x = i => L + i / (n - 1) * (W - L - R), y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  const grid = tk.map(v => `<line class="g" x1="${L}" x2="${W - R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/>`).join("");
  const xl = [0, Math.round((n - 1) / 2), n - 1].map((i, k) => `<text class="ax" x="${x(i).toFixed(1)}" y="${H - 5}" text-anchor="${["start", "middle", "end"][k]}">${i === n - 1 ? "oggi" : shortDate(days[i])}</text>`).join("");
  const goal = near ? `<line class="goal" x1="${L}" x2="${W - R}" y1="${y(tg).toFixed(1)}" y2="${y(tg).toFixed(1)}"/><text class="gl" x="${L + 2}" y="${(y(tg) - 5).toFixed(1)}">obiettivo ${fmt(tg)}</text>` : "";
  const line = ma.length > 1 ? `<path class="ma" d="${ma.map((p, k) => `${k ? "L" : "M"}${x(p.i).toFixed(1)},${y(p.v).toFixed(1)}`).join("")}"/>` : "";
  const dots = pts.map(p => hitDot(x(p.i).toFixed(1), y(p.v).toFixed(1), `${shortDate(days[p.i])} · ${fmt(p.v)} kg`, "pt", 3)).join("");
  const e = ma.at(-1);
  const end = e ? hitDot(x(e.i).toFixed(1), y(e.v).toFixed(1), `media 7 gg · ${fmt(e.v)} kg`, "end", 4) : "";
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Peso degli ultimi ${n} giorni: pesate e media mobile a 7 giorni">${grid}${goal}${line}${end}${dots}${xl}</svg>
  <div class="spark-leg"><span><i class="l"></i>media 7 gg</span><span><i class="d"></i>pesata</span>${tg != null && !near ? `<span><i class="k"></i>obiettivo ${fmt(tg)} kg ${tg > hi ? "↑ sopra il grafico" : "↓ sotto il grafico"}</span>` : ""}</div>`;
}

  <div class="tiles">

/* ============ fumetto con il valore quando tocchi un punto del grafico ============ */
let TIP = null;
function hideTip() { if (!TIP) return; TIP.el.remove(); TIP.g.classList.remove("sel"); TIP = null; }
function showTip(g) {
  const same = TIP && TIP.g === g; hideTip(); if (same) return;
  const r = (g.querySelector(".pt,.raw,.end,.col") || g).getBoundingClientRect(), el = document.createElement("div");
  el.className = "tip"; el.setAttribute("role", "status"); el.textContent = g.dataset.tip; document.body.appendChild(el);
  const w = el.offsetWidth, cx = r.left + r.width / 2, left = Math.max(8 + w / 2, Math.min(innerWidth - 8 - w / 2, cx));
  el.style.left = left + "px"; el.style.top = (r.top - 8) + "px"; el.style.setProperty("--ax", (cx - left) + "px");
  g.classList.add("sel"); TIP = { el, g };
}
document.addEventListener("click", e => {
